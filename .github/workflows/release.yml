name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 建虚拟环境 + 安装依赖
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: 先跑一遍测试（红了不发版）
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest tests -q

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { throw "ISCC 未安装成功" }

      - name: 打包 exe + 安装包
        shell: pwsh
        run: .\tools\build.ps1

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = .\.venv\Scripts\python.exe -c "from app.config import APP_VERSION; print(APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物（供手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: BookShelf-Setup-${{ steps.ver.outputs.version }}
          path: |
            release/BookShelf-Setup-*.exe
            release/checksums.txt
          retention-days: 30

      - name: 创建 GitHub Release 并附安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = "${{ steps.ver.outputs.version }}"
          gh release create $tag `
            "release/BookShelf-Setup-$ver.exe" `
            "release/checksums.txt" `
            --title "书格 $ver" `
            --notes "见 CHANGELOG.md。" `
            --verify-tag
